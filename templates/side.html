*{
    margin:0;

}

body{
    background:#f5f5f5;
}

.container{
    display:flex;
    height:100vh;
}

/* Sidebar */

.sidebar{
    width:250px;
    background:#000000;
    color:#fff;
    display:flex;
    flex-direction:column;
}

.logo{
    padding:35px;
    text-align:center;
    border-bottom:1px solid rgba(243, 238, 238, 0.15);
}

.logo h2{
    font-size:20px;
}

.sidebar ul{
    list-style:none;
    margin-top:20px;
}

.sidebar ul li{
    margin:8px 0;
}

.sidebar ul li a{
    display:block;
    color:white;
    border-bottom:1px solid rgba(242, 235, 235, 0.15);
    text-decoration:none;
    padding:16px 30px;
    transition:.3s;
    font-size:18px;
}

.sidebar ul li a:hover{
    background:#f7f9fc;
    border-left:5px solid #60A5FA;
}

/* Main */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.main h1{
    margin-bottom:40px;
    font-size:42px;
}

.login-box{
    width:650px;
    background:#FFE2B9;
    padding:40px;
    border-radius:15px;
}

.login-box label{
    display:block;
    margin-bottom:8px;
    font-size:18px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:25px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.login-box button{
    background:#2563EB;
    color:white;
    border:none;
    padding:14px 35px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.login-box button:hover{
    background:#f7f8fb;
}

.logo img {
    width: 150px;
    height: 150px;
    object-fit: contain;
    /* transform: translateX(-10px); */
    display: flexbox;
    border-radius: 50px;
    margin-right: 60px;
}
</style>

<div class="container">
