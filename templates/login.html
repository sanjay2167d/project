<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='loader.css') }}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.login-card{

width:570px;
background:#000;
border-radius:20px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.35);

}

.logo{

display:block;
margin:auto;
width:200px;
margin-bottom:10px;

}

.title{

color:white;
text-align:center;
font-size:55px;
font-weight:800;
line-height:65px;

}

.subtitle{

text-align:center;
color:#a6a6a6;
font-size:35px;
margin-top:10px;
margin-bottom:30px;

}

label{

color:white;
font-weight:bold;
margin-bottom:8px;

}

.form-control{

height:50px;
border-radius:18px;
font-size:20px;
padding-left:20px;
border:none;

}

.form-control:focus{

box-shadow:0 0 12px rgba(255,255,255,.25);

}

.change{

text-align:right;
margin-top:12px;
margin-bottom:20px;

}

.change a{

color:#b8b8b8;
text-decoration:none;

}

.change a:hover{

color:white;

}

.error{

text-align:center;
color:red;
font-weight:bold;
margin-bottom:20px;

}

.login-btn{

width:40%;
height:40px;
margin-left: 130px;
border:none;
border-radius:22px;

background:linear-gradient(to right,#16014c,#2a08e9);

font-size:22px;
font-weight:bold;

color:#cbc4c4;

transition:.3s;

}

.login-btn:hover{

transform:translateY(-3px);

}

.new{

text-align:center;
color:#999;
margin-top:35px;
margin-bottom:10px;
font-size:22px;

}

.register-btn{

display:block;
width:40%;
/* padding:18px; */

background:linear-gradient(to right,#f7f7f4,#edeee2);

color:rgb(14, 13, 13);

text-align:center;

border-radius:20px;

font-weight:bold;
height:40px;
margin-left: 130px;

font-size:22px;

text-decoration:none;

transition:.3s;

}

.register-btn:hover{

transform:translateY(-3px);
color:black;

}

.footer{

text-align:center;
color:#777;
margin-top:40px;
letter-spacing:2px;

}

/* Modal */

.custom-modal{

background:#111;
border-radius:20px;
border:2px solid #444;

}

.custom-modal .form-control{

background:#222;
color:white;
border:1px solid #555;

}

.custom-modal .form-control::placeholder{

color:#999;

}

.update-btn{

width:200px;
margin:auto;

}

/* ============================= */
/* Responsive Design */
/* ============================= */

@media (max-width:768px){

body{

padding:20px;

}

.login-card{

width:100%;
max-width:600px;

background:#000;
border-radius:20px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.35);

}

.logo{

width:150px;

}

.subtitle{

font-size:24px;
margin-bottom:25px;

}

.form-control{

height:45px;
font-size:16px;

}

.login-btn{

display:block;
width:100%;
max-width:220px;
height:40px;
margin:20px auto;

border:none;
border-radius:22px;

background:linear-gradient(to right,#16014c,#2a08e9);

font-size:22px;
font-weight:bold;
color:#cbc4c4;

transition:.3s;

}
.register-btn{

width:100%;
max-width:none;
margin:15px 0;

}

.new{

font-size:18px;
margin-top:25px;

}

.change{

text-align:center;

}

.change a{

font-size:16px;

}

.footer{

font-size:14px;

}

.modal-dialog{

margin:15px;

}

}
</style>

</head>

<body>

<div class="login-card">

<img src="{{ url_for('static', filename='logo.jpg') }}" class="logo">



<p class="subtitle">
LOGIN TO CONTINUE
</p>

<form action="/login" method="POST">

<div class="mb-3">

<label>USERNAME :</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required
minlength="4"
maxlength="20"
pattern="[A-Za-z0-9_]+"
title="Username can contain only letters, numbers and underscore">

</div>

<div class="mb-3">

<label>PASSWORD :</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required
minlength="6"
maxlength="20">

</div>

<div class="change">

<a href="#"
data-bs-toggle="modal"
data-bs-target="#changePasswordModal">

Change Password?

</a>

</div>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

<button class="login-btn">

LOGIN

</button>

<div class="new">

New User?

</div>

<a
href="/register_page"
class="register-btn">

REGISTER

</a>

</form>



</div>

<!-- Change Password Modal -->

<div class="modal fade" id="changePasswordModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content custom-modal">

            <div class="modal-header border-0">

                <h4 class="modal-title text-white">
                    CHANGE PASSWORD
                </h4>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <form action="/change_password" method="POST">

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="text-white">
                            USERNAME
                        </label>

                        <input
type="text"
name="username"
class="form-control"
required
minlength="4"
maxlength="20"
pattern="[A-Za-z0-9_]+">

                    </div>

                    <div class="mb-3">

                        <label class="text-white">
                            NEW PASSWORD
                        </label>

                        <input
type="password"
name="new_password"
class="form-control"
required
minlength="8"
maxlength="20">

                    </div>

                    <div class="mb-3">

                        <label class="text-white">
                            CONFIRM PASSWORD
                        </label>

                        <input
type="password"
name="confirm_password"
class="form-control"
required
minlength="8"
maxlength="20">

                    </div>

                </div>

                <div class="modal-footer border-0">

                    <button
                        type="submit"
                        class="btn btn-light update-btn">

                        UPDATE PASSWORD

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='loader.js') }}"></script>
<div id="loader">

    <div class="loader-box">

        <img src="{{ url_for('static', filename='logo.jpg') }}" class="loader-logo">

        <div class="spinner"></div>

        <div class="loading-text">
            Loading...
        </div>

    </div>

</div>
</body>
</html>
