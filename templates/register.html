<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='loader.css') }}">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.register-card{

width:570px;
background:#000;
border-radius:20px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.35);


}

.logo{

display:block;
margin:auto;
width:200px;
margin-bottom:10px;

}

.title{

color:white;
font-size:52px;
font-weight:800;
text-align:center;
line-height:60px;

}

.subtitle{

color:#a5a5a5;
text-align:center;
font-size:30px;
margin-top:10px;
margin-bottom:30px;

}

label{

color:white;
font-weight:bold;
margin-bottom:8px;

}

.form-control{

height:50px;
border-radius:18px;
font-size:20px;
padding-left:18px;
border:none;

}

.form-control:focus{

box-shadow:0 0 12px rgba(255,255,255,.25);

}

.register-btn{

width:40%;
height:40px;
margin-top:20px;
margin-left: 130px;
border:none;
border-radius:22px;

background:linear-gradient(to right,#ffffff,#bfbfbf);

font-size:22px;
font-weight:bold;
color:black;

transition:.3s;

}

.register-btn:hover{

transform:translateY(-3px);

}

.login-link{

text-align:center;
margin-top:30px;
color:#9d9d9d;
font-size:20px;

}

.login-link a{

color:white;
text-decoration:none;
font-weight:bold;

}

.login-link a:hover{

text-decoration:underline;

}

.footer{

text-align:center;
margin-top:35px;
color:#777;
letter-spacing:2px;

}


@media (max-width:768px){

.register-card{

margin:20px;
padding:25px;

}

.logo{

width:150px;

}

.subtitle{

font-size:24px;

}

.form-control{

height:45px;
font-size:16px;

}

.register-btn{

width:100%;
max-width:none;
margin-left:0;

}

.login-link{

font-size:17px;

}

}

</style>

</head>

<body>

<div class="register-card">

<img src="{{ url_for('static', filename='logo.jpg') }}"
class="logo">



<p class="subtitle">
CREATE  YOUR  ACCOUNT
</p>

{% if error %}
<div class="alert alert-danger text-center">
    {{ error }}
</div>
{% endif %}

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-success text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<form action="/register" method="POST">

<div class="mb-3">

<label>USERNAME :</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required
autofocus
minlength="4"
maxlength="20"
pattern="[A-Za-z0-9_]+"
title="Username can contain only letters, numbers and underscore">
</div>

<div class="mb-3">

<label>PASSWORD :</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required
minlength="8"
maxlength="20"
pattern="^(?=.*[A-Za-z])(?=.*\d).{8,20}$"
title="Password must be 8-20 characters and contain at least one letter and one number">

</div>

<div class="mb-3">

<label>E-MAIL :</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Email Address"
required
maxlength="100">

</div>

<div class="mb-3">

<label>PHONE :</label>

<input
type="tel"
name="phone"
class="form-control"
placeholder="Enter Phone Number"
required
pattern="[0-9]{10}"
maxlength="10"
title="Enter a valid 10-digit phone number">

</div>

<button class="register-btn">

REGISTER

</button>

<div class="login-link">
    Already have an account?

    <a href="{{ url_for('auth.admin_login') }}">
    Login
</a>
</div>

</div>

</form>



</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='loader.js') }}"></script>
<div id="loader">

    <div class="loader-box">

        <img src="{{ url_for('static', filename='logo.jpg') }}" class="loader-logo">

        <div class="spinner"></div>

        <div class="loading-text">
            Loading...
        </div>

    </div>

</div>
</body>
</html>
