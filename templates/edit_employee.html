<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Employee | AURA Solutions</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#f3f4f6,#e8ecef);
min-height:100vh;

}

/* ==========================
        NAVBAR
========================== */

.navbar{

height:90px;
background:#000;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 50px;
position:relative;

box-shadow:0 6px 20px rgba(0,0,0,.15);

}

.logo-title{

display:flex;
align-items:center;
gap:18px;

}

.logo-title img{

width:58px;
height:58px;
border-radius:50%;
object-fit:cover;

}

.company-name{
position:absolute;
left:50%;
transform:translateX(-50%);
color:white;
font-size:39px;
font-weight:700;
letter-spacing:6px;
margin:0;
text-align:center;
white-space:nowrap;
}

.back-btn{

background:white;
color:black;

padding:12px 24px;

text-decoration:none;

border-radius:30px;

font-weight:600;

transition:.3s;

}

.back-btn:hover{

background:#28a745;

color:white;

transform:translateY(-2px);

}

/* ==========================
      MAIN CARD
========================== */

.main{

padding:45px;

display:flex;

justify-content:center;

align-items:center;

}

.card-box{

width:1100px;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:0 15px 45px rgba(0,0,0,.18);

}

/* ==========================
      HEADER
========================== */

.card-header{

background:#111;

padding:40px;

text-align:center;

}

.avatar{

width:95px;
height:95px;

background:#28a745;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

margin:auto;

font-size:42px;

color:white;

box-shadow:0 0 20px rgba(40,167,69,.45);

}

.card-header h2{

color:white;

margin-top:20px;

font-weight:700;

letter-spacing:2px;

}

.card-header p{

color:#d0d0d0;

margin-top:8px;

}

/* ==========================
        BODY
========================== */

.card-body{

padding:40px;

}

label{

font-weight:600;

margin-bottom:8px;

}

.form-control,
.form-select{

height:52px;

border-radius:12px;

border:1px solid #090909;

}

.form-control:focus,
.form-select:focus{

border-color:#28a745;

box-shadow:0 0 10px rgba(40,167,69,.25);

}

textarea.form-control{

height:120px;

resize:none;

}

/* ==========================
      BUTTONS
========================== */

.btn-update{

background:#28a745;

color:white;

padding:13px 45px;

border:none;

border-radius:30px;

font-weight:600;

transition:.3s;

}

.btn-update:hover{

background:#1d8a37;

transform:translateY(-3px);

}

.btn-cancel{

background:#6c757d;

color:white;

padding:13px 45px;

border-radius:30px;

text-decoration:none;

font-weight:600;

transition:.3s;

}

.btn-cancel:hover{

background:#555;

color:white;

transform:translateY(-3px);

}

.footer{

text-align:center;

padding:20px;

background:#fafafa;

color:#666;

font-size:14px;

letter-spacing:2px;

}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo-title">
<img src="{{ url_for('static', filename='logo.jpg') }}">
</div>

<h2 class="company-name">AURA SOLUTIONS</h2>

<a href="{{ url_for('admin.employee_list') }}" class="back-btn">

← Employee List

</a>

</nav>

<div class="main">

<div class="card-box">

<div class="card-header">

<div class="avatar">
👤
</div>

<h2>Edit Employee Details</h2>

<p>Update employee information</p>

</div>

<div class="card-body">

<form action="{{ url_for('admin.update_employee') }}" method="POST">

<input type="hidden" name="id" value="{{ employee[0] }}">

<div class="row">

    <div class="col-md-6 mb-4">
        <label>First Name</label>
        <input type="text" class="form-control" name="firstname"
               value="{{ employee[1] }}" required>
    </div>

    <div class="col-md-6 mb-4">
        <label>Last Name</label>
        <input type="text" class="form-control" name="lastname"
               value="{{ employee[2] }}" required>
    </div>

    <div class="col-md-6 mb-4">
        <label>Age</label>
        <input type="number" class="form-control" name="age"
               value="{{ employee[13] }}" required>
    </div>

    <div class="col-md-6 mb-4">
        <label>Gender</label>

        <select class="form-select" name="gender">

            <option value="Male"
            {% if employee[3]=='Male' %}selected{% endif %}>
            Male
            </option>

            <option value="Female"
            {% if employee[3]=='Female' %}selected{% endif %}>
            Female
            </option>

        </select>

    </div>

    <div class="col-md-6 mb-4">
        <label>Date of Birth</label>
        <input type="date" class="form-control"
               name="dob"
               value="{{ employee[4] }}">
    </div>

    <div class="col-md-6 mb-4">
        <label>Phone Number</label>
        <input type="text"
               class="form-control"
               name="phone"
               value="{{ employee[5] }}">
    </div>

    <div class="col-md-6 mb-4">
        <label>Email Address</label>
        <input type="email"
               class="form-control"
               name="email"
               value="{{ employee[6] }}">
    </div>

    <div class="col-md-6 mb-4">

        <label>Department</label>

        <select class="form-select" name="department">

            <option value="Human Resources"
            {% if employee[8]=='Human Resources' %}selected{% endif %}>
            Human Resources
            </option>

            <option value="Finance"
            {% if employee[8]=='Finance' %}selected{% endif %}>
            Finance
            </option>

            <option value="Marketing"
            {% if employee[8]=='Marketing' %}selected{% endif %}>
            Marketing
            </option>

            <option value="Sales"
            {% if employee[8]=='Sales' %}selected{% endif %}>
            Sales
            </option>

            <option value="Information Technology"
            {% if employee[8]=='Information Technology' %}selected{% endif %}>
            Information Technology
            </option>

            <option value="Operations"
            {% if employee[8]=='Operations' %}selected{% endif %}>
            Operations
            </option>

        </select>

    </div>

    <div class="col-md-6 mb-4">
        <label>Designation</label>
        <input type="text"
               class="form-control"
               name="designation"
               value="{{ employee[9] }}">
    </div>

    <div class="col-md-6 mb-4">
        <label>Joining Date</label>
        <input type="date"
               class="form-control"
               name="joining_date"
               value="{{ employee[10] }}">
    </div>

    <div class="col-md-6 mb-4">
        <label>Salary</label>
        <input type="number"
               class="form-control"
               name="salary"
               value="{{ employee[11] }}">
    </div>

    <div class="col-md-6 mb-4">

        <label>Status</label>

        <select class="form-select" name="status">

            <option value="Active"
            {% if employee[12]=='Active' %}selected{% endif %}>
            Active
            </option>

            <option value="Inactive"
            {% if employee[12]=='Inactive' %}selected{% endif %}>
            Inactive
            </option>

            <option value="On Leave"
            {% if employee[12]=='On Leave' %}selected{% endif %}>
            On Leave
            </option>

        </select>

    </div>

    <div class="col-12 mb-4">

        <label>Address</label>

        <textarea class="form-control"
                  name="address">{{ employee[7] }}</textarea>

    </div>

</div>

<div class="text-center mt-4">

    <button type="submit" class="btn-update">

        💾 Update Employee

    </button>

    <a href="{{ url_for('admin.employee_list') }}"
       class="btn-cancel ms-3">

        Cancel

    </a>

</div>

</form>

</div>

<div class="footer">

© 2026 AURA SOLUTIONS | Employee Management System

</div>

</div>

</div>

</body>

</html>
