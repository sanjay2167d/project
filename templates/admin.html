<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.admin-card{

width:500px;
background:#000;
border-radius:20px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.35);

}

.logo{

display:block;
margin:auto;
width:150px;
margin-bottom:10px;

}

.subtitle{

text-align:center;
color:#a6a6a6;
font-size:30px;
margin-top:10px;
margin-bottom:35px;

}

label{

color:white;
font-weight:bold;
margin-bottom:8px;

}

.form-control{

height:40px;
border-radius:18px;
font-size:20px;
padding-left:20px;
border:none;

}

.form-control:focus{

box-shadow:0 0 12px rgba(255,255,255,.25);

}

.verify-btn{

width:25%;
height:40px;
margin-left:150px;
margin-top:15px;

border:none;
border-radius:22px;

background:linear-gradient(to right,#ffffff,#bfbfbf);

font-size:20px;
font-weight:bold;

color:black;

transition:.3s;

}

.verify-btn:hover{

transform:translateY(-3px);

}

.error{

text-align:center;
color:red;
font-weight:bold;
margin-top:20px;

}

.footer{

text-align:center;
color:#777;
margin-top:35px;
letter-spacing:2px;

}

</style>

</head>

<body>

<div class="admin-card">

<img
src="{{ url_for('static', filename='logo.jpg') }}"
class="logo">

<p class="subtitle">

ADMIN ACCESS

</p>

<form action="{{ url_for('admin.verify_admin') }}" method="POST">

<div class="mb-3">

<label>

ADMIN SECURITY KEY :

</label>

<input
type="password"
name="passkey"
class="form-control"
placeholder="Enter Admin Security Key"
required>

</div>

<button class="verify-btn">

VERIFY

</button>

</form>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

<div class="footer">

Authorized Access Only

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
