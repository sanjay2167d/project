<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='loader.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Solutions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
    min-height:100vh;
    background:#fffefe;
    font-family:'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    padding:20px;
}

        .selection-card{
    width:50%;
    max-width:620px;
    background:#000000;
    border:1px solid #2f2f2f;
    border-radius:25px;
    padding:45px;
    text-align:center;
    box-shadow:
    0 0 30px rgba(255,255,255,0.05),
    0 0 60px rgba(255,255,255,0.02);
}

        .logo{
    width:100%;
    max-width:250px;
    height:auto;
    border-radius:25px;
    margin-bottom:25px;
}

        .title{
            font-size:42px;
            font-weight:700;
            color:#ffffff;
            margin-bottom:10px;
            letter-spacing:2px;
        }

        .subtitle{
            color:#a8a8a8;
            font-size:16px;
            margin-bottom:35px;
            letter-spacing:1px;
        }

        .role-btn{
            width:100%;
            padding:16px;
            margin-top:18px;
            border:none;
            border-radius:14px;
            font-size:18px;
            font-weight:700;
            letter-spacing:2px;

            background:linear-gradient(
                135deg,
                #ffffff,
                #d9d9d9,
                #b5b5b5
            );

            color:#000;
            cursor:pointer;
            transition:all 0.3s ease;
        }

        .role-btn:hover{
            transform:translateY(-4px);
            box-shadow:0 0 25px rgba(255,255,255,0.35);
        }

        .footer-text{
            margin-top:30px;
            color:#777;
            font-size:13px;
            letter-spacing:1px;
        }
/* ========================= */
/* Tablet */
/* ========================= */

@media (max-width:768px){

    .selection-card{
        padding:35px 25px;
    }

    .title{
        font-size:32px;
        line-height:1.3;
    }

    .subtitle{
        font-size:15px;
    }

    .role-btn{
        padding:14px;
        font-size:16px;
    }

    .footer-text{
        font-size:12px;
    }
}

/* ========================= */
/* Mobile */
/* ========================= */

@media (max-width:576px){

    body{
        padding:20px;
    }

    .selection-card{
        width:100%;
        padding:25px 20px;
        border-radius:20px;
    }

    .logo{
        max-width:220px;
        margin-bottom:20px;
    }

    .title{
        font-size:24px;
        letter-spacing:1px;
    }

    .subtitle{
        font-size:14px;
        margin-bottom:25px;
    }

    .role-btn{
        font-size:15px;
        padding:12px;
        letter-spacing:1px;
    }

    .footer-text{
        margin-top:20px;
        font-size:11px;
    }
}
    </style>
</head>
<body>

    <div class="selection-card">

        <img
            src="{{ url_for('static', filename='logo.jpg') }}"
            alt="AURA Logo"
            class="logo"
        >

        <div class="title">
            Welcome to AURA Solutions
        </div>

        <div class="subtitle">
            Select your portal to continue
        </div>

        <a href="/employee-login" style="text-decoration:none;">
            <button class="role-btn">
                EMPLOYEE
            </button>
        </a>

        <a href="/admin-login" style="text-decoration:none;">
            <button class="role-btn" onclick="showLoader('/admin-login')">
                ADMIN
            </button>
        </a>
        <div class="footer-text">
            Find Your Solutions
        </div>

    </div>
    <script src="{{ url_for('static', filename='loader.js') }}"></script>
    

<div id="loader">

    <div class="loader-container">

        <div id="ball"></div>

        <div id="arm"></div>

        <div id="part"></div>

        <div id="logo">
            <span>A</span>
            <span>U</span>
            <span>R</span>
            <span>A</span>
        </div>

    </div>

</div>
</body>
</html>
